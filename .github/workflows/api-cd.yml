name: API CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/api-cd.yml"

permissions:
  contents: read

concurrency:
  group: api-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/shared-todo-api

    outputs:
      image_ref: ${{ steps.image.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.title=shared-todo API

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: apps/api
          file: apps/api/src/SharedTodo.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve immutable image reference
        id: image
        run: echo "ref=${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo "- Tag: \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`"
            echo "- Immutable ref: \`${{ steps.image.outputs.ref }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest

    environment:
      name: api-prod
      url: https://api.shared-todo.grabreu.dev

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update migration job image
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az containerapp job update \
              --name caj-shared-todo-migration-prod \
              --resource-group rg-shared-prod \
              --image ${{ needs.publish.outputs.image_ref }}

      - name: Run database migration
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            set -e

            EXECUTION_NAME=$(az containerapp job start \
              --name caj-shared-todo-migration-prod \
              --resource-group rg-shared-prod \
              --query name -o tsv)

            echo "Started execution: $EXECUTION_NAME"

            for i in $(seq 1 30); do
              STATUS=$(az containerapp job execution show \
                --name caj-shared-todo-migration-prod \
                --resource-group rg-shared-prod \
                --job-execution-name "$EXECUTION_NAME" \
                --query properties.status -o tsv)

              echo "Status: $STATUS"

              if [ "$STATUS" = "Succeeded" ]; then
                exit 0
              fi

              if [ "$STATUS" = "Failed" ]; then
                echo "Migration failed"
                exit 1
              fi

              sleep 10
            done

            echo "Timed out waiting for migration to finish"
            exit 1

      - name: Update Container App image
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        with:
          inlineScript: |
            az containerapp update \
              --name ca-shared-todo-api-prod \
              --resource-group rg-shared-prod \
              --image ${{ needs.publish.outputs.image_ref }}
